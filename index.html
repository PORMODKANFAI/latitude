
<style>
  .geo-wrap { padding: 2rem 1.5rem; display: flex; flex-direction: column; align-items: center; gap: 1.5rem; }
  .geo-card { background: var(--color-background-primary); border: 0.5px solid var(--color-border-tertiary); border-radius: var(--border-radius-lg); padding: 1.5rem; width: 100%; max-width: 480px; }
  .pulse-ring { width: 80px; height: 80px; border-radius: 50%; background: #E6F1FB; display: flex; align-items: center; justify-content: center; position: relative; margin: 0 auto 1rem; }
  .pulse-ring::before { content: ''; position: absolute; width: 80px; height: 80px; border-radius: 50%; border: 2px solid #378ADD; opacity: 0; animation: none; }
  .pulse-ring.active::before { animation: ripple 1.2s ease-out infinite; }
  @keyframes ripple { 0% { transform: scale(1); opacity: 0.6; } 100% { transform: scale(1.8); opacity: 0; } }
  .loc-icon { font-size: 32px; color: #185FA5; }
  .geo-title { font-size: 18px; font-weight: 500; color: var(--color-text-primary); text-align: center; margin: 0 0 4px; }
  .geo-sub { font-size: 14px; color: var(--color-text-secondary); text-align: center; margin: 0 0 1.25rem; }
  .btn-locate { width: 100%; padding: 12px; border-radius: var(--border-radius-md); border: none; background: #185FA5; color: #fff; font-size: 15px; font-weight: 500; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: background 0.15s, transform 0.1s; }
  .btn-locate:hover { background: #0C447C; }
  .btn-locate:active { transform: scale(0.98); }
  .btn-locate:disabled { background: var(--color-background-secondary); color: var(--color-text-secondary); cursor: not-allowed; }
  .result-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 1rem; }
  .result-full { grid-column: 1 / -1; }
  .metric-card { background: var(--color-background-secondary); border-radius: var(--border-radius-md); padding: 12px 14px; }
  .metric-label { font-size: 12px; color: var(--color-text-secondary); margin-bottom: 4px; display: flex; align-items: center; gap: 5px; }
  .metric-value { font-size: 16px; font-weight: 500; color: var(--color-text-primary); word-break: break-all; }
  .accuracy-bar-wrap { margin-top: 6px; height: 4px; background: var(--color-border-tertiary); border-radius: 2px; overflow: hidden; }
  .accuracy-bar { height: 4px; border-radius: 2px; background: #1D9E75; transition: width 0.6s; }
  .status-msg { font-size: 13px; color: var(--color-text-secondary); text-align: center; min-height: 18px; }
  .status-msg.error { color: #A32D2D; }
  .copy-btn { background: none; border: 0.5px solid var(--color-border-tertiary); border-radius: var(--border-radius-md); padding: 6px 10px; font-size: 12px; color: var(--color-text-secondary); cursor: pointer; display: flex; align-items: center; gap: 4px; margin-top: 8px; transition: background 0.15s; }
  .copy-btn:hover { background: var(--color-background-secondary); }
  .map-link { display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 13px; color: #185FA5; text-decoration: none; margin-top: 0.75rem; }
  .map-link:hover { text-decoration: underline; }
  #results { display: none; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>

<div class="geo-wrap">
  <h2 class="sr-only">เครื่องมือค้นหาพิกัดปัจจุบัน</h2>
  <div class="geo-card">
    <div class="pulse-ring" id="pulseRing">
      <i class="ti ti-map-pin loc-icon" aria-hidden="true"></i>
    </div>
    <p class="geo-title">พิกัดของคุณ</p>
    <p class="geo-sub">กดปุ่มเพื่อตรวจสอบตำแหน่งปัจจุบันของคุณ</p>

    <button class="btn-locate" id="locateBtn" onclick="getLocation()">
      <i class="ti ti-current-location" aria-hidden="true"></i>
      ค้นหาพิกัดปัจจุบัน
    </button>

    <p class="status-msg" id="statusMsg" style="margin-top: 12px;"></p>

    <div id="results">
      <div class="result-grid">
        <div class="metric-card">
          <div class="metric-label"><i class="ti ti-arrow-up" aria-hidden="true"></i> ละติจูด</div>
          <div class="metric-value" id="lat">—</div>
        </div>
        <div class="metric-card">
          <div class="metric-label"><i class="ti ti-arrow-right" aria-hidden="true"></i> ลองจิจูด</div>
          <div class="metric-value" id="lng">—</div>
        </div>
        <div class="metric-card result-full">
          <div class="metric-label"><i class="ti ti-circle-check" aria-hidden="true"></i> ความแม่นยำ</div>
          <div class="metric-value" id="acc">—</div>
          <div class="accuracy-bar-wrap"><div class="accuracy-bar" id="accBar" style="width:0%"></div></div>
        </div>
      </div>

      <div style="display:flex; gap:8px; flex-wrap:wrap; margin-top:10px;">
        <button class="copy-btn" onclick="copyCoords()">
          <i class="ti ti-copy" aria-hidden="true"></i> คัดลอกพิกัด
        </button>
        <button class="copy-btn" onclick="copyJSON()">
          <i class="ti ti-code" aria-hidden="true"></i> คัดลอก JSON
        </button>
      </div>

      <a class="map-link" id="mapLink" href="#" target="_blank">
        <i class="ti ti-map-2" aria-hidden="true"></i> เปิดใน Google Maps
      </a>
    </div>
  </div>
</div>

<script>
let coords = null;

function getLocation() {
  const btn = document.getElementById('locateBtn');
  const status = document.getElementById('statusMsg');
  const ring = document.getElementById('pulseRing');

  if (!navigator.geolocation) {
    status.textContent = 'Browser ไม่รองรับ Geolocation';
    status.className = 'status-msg error';
    return;
  }

  btn.disabled = true;
  btn.innerHTML = '<i class="ti ti-loader" aria-hidden="true" style="animation:spin 1s linear infinite"></i> กำลังค้นหา...';
  status.textContent = 'กำลังระบุตำแหน่ง...';
  status.className = 'status-msg';
  ring.classList.add('active');

  navigator.geolocation.getCurrentPosition(
    function(position) {
      coords = {
        lat: position.coords.latitude,
        lng: position.coords.longitude,
        accuracy: Math.round(position.coords.accuracy)
      };

      document.getElementById('lat').textContent = coords.lat.toFixed(6);
      document.getElementById('lng').textContent = coords.lng.toFixed(6);
      document.getElementById('acc').textContent = coords.accuracy + ' เมตร';

      const pct = Math.max(10, Math.min(100, 100 - (coords.accuracy / 200 * 100)));
      document.getElementById('accBar').style.width = pct + '%';
      if (coords.accuracy > 100) {
        document.getElementById('accBar').style.background = '#BA7517';
      }

      // ใช้ format /@lat,lng,zoom เพื่อให้ pin ตรงพิกัด ไม่ใช่ search result
      const mapUrl = 'https://www.google.com/maps/place/' + coords.lat + ',' + coords.lng + '/@' + coords.lat + ',' + coords.lng + ',16z';
      document.getElementById('mapLink').href = mapUrl;

      document.getElementById('results').style.display = 'block';
      status.textContent = 'พบตำแหน่งเรียบร้อย';
      status.className = 'status-msg';
      ring.classList.remove('active');
      ring.style.background = '#E1F5EE';
      ring.querySelector('i').style.color = '#0F6E56';

      btn.disabled = false;
      btn.innerHTML = '<i class="ti ti-refresh" aria-hidden="true"></i> อัปเดตพิกัด';
    },
    function(error) {
      const msgs = {
        1: 'ไม่ได้รับอนุญาตให้เข้าถึงตำแหน่ง กรุณาอนุญาตในเบราว์เซอร์',
        2: 'ไม่สามารถระบุตำแหน่งได้ในขณะนี้',
        3: 'หมดเวลาในการค้นหาตำแหน่ง'
      };
      status.textContent = msgs[error.code] || 'เกิดข้อผิดพลาด: ' + error.message;
      status.className = 'status-msg error';
      ring.classList.remove('active');
      btn.disabled = false;
      btn.innerHTML = '<i class="ti ti-current-location" aria-hidden="true"></i> ลองอีกครั้ง';
    },
    { enableHighAccuracy: true, timeout: 10000 }
  );
}

function copyCoords() {
  if (!coords) return;
  navigator.clipboard.writeText(coords.lat.toFixed(6) + ', ' + coords.lng.toFixed(6));
  showToast('คัดลอกแล้ว!');
}

function copyJSON() {
  if (!coords) return;
  navigator.clipboard.writeText(JSON.stringify({ latitude: coords.lat, longitude: coords.lng, accuracy: coords.accuracy }, null, 2));
  showToast('คัดลอก JSON แล้ว!');
}

function showToast(msg) {
  const t = document.createElement('div');
  t.textContent = msg;
  t.style.cssText = 'position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#185FA5;color:#fff;padding:8px 16px;border-radius:8px;font-size:13px;z-index:999;';
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2000);
}
</script>
