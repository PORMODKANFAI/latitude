<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ตรวจสอบพิกัด</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', sans-serif;
    background: #f0f4f8;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1rem;
  }
  .card {
    background: #fff;
    border-radius: 20px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.08);
    padding: 2rem 1.75rem;
    width: 100%;
    max-width: 420px;
  }
  .pin-wrap {
    width: 72px; height: 72px;
    border-radius: 50%;
    background: #e6f1fb;
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 1.25rem;
    position: relative;
  }
  .pin-wrap::before {
    content: '';
    position: absolute;
    width: 72px; height: 72px;
    border-radius: 50%;
    border: 2px solid #378ADD;
    opacity: 0;
  }
  .pin-wrap.active::before { animation: ripple 1.2s ease-out infinite; }
  @keyframes ripple {
    0%   { transform: scale(1); opacity: 0.6; }
    100% { transform: scale(1.9); opacity: 0; }
  }
  .pin-wrap svg { width: 32px; height: 32px; fill: #185FA5; }
  h1 { font-size: 1.2rem; font-weight: 600; color: #1a1a2e; text-align: center; margin-bottom: 4px; }
  .subtitle { font-size: 0.875rem; color: #6b7280; text-align: center; margin-bottom: 1.5rem; }
  .btn {
    width: 100%; padding: 13px;
    background: #185FA5; color: #fff;
    border: none; border-radius: 12px;
    font-size: 0.95rem; font-weight: 600;
    cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;
    transition: background 0.15s, transform 0.1s;
  }
  .btn:hover { background: #0C447C; }
  .btn:active { transform: scale(0.98); }
  .btn:disabled { background: #e5e7eb; color: #9ca3af; cursor: not-allowed; }
  .status { font-size: 0.8rem; color: #6b7280; text-align: center; margin-top: 10px; min-height: 18px; }
  .status.error { color: #dc2626; }
  .results { display: none; margin-top: 1.25rem; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .metric {
    background: #f8fafc; border-radius: 10px; padding: 11px 13px;
  }
  .metric.full { grid-column: 1 / -1; }
  .metric-label { font-size: 11px; color: #9ca3af; margin-bottom: 3px; display: flex; align-items: center; gap: 4px; }
  .metric-value { font-size: 15px; font-weight: 600; color: #1a1a2e; word-break: break-all; }
  .bar-wrap { height: 4px; background: #e5e7eb; border-radius: 2px; margin-top: 7px; overflow: hidden; }
  .bar { height: 4px; border-radius: 2px; background: #10b981; transition: width 0.6s; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .action-btn {
    flex: 1; padding: 8px 10px;
    background: none; border: 1px solid #e5e7eb; border-radius: 8px;
    font-size: 12px; color: #6b7280; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 5px;
    transition: background 0.12s;
  }
  .action-btn:hover { background: #f0f4f8; }
  .map-link {
    display: flex; align-items: center; justify-content: center; gap: 6px;
    font-size: 0.82rem; color: #185FA5; text-decoration: none; margin-top: 12px;
    padding: 9px; border-radius: 9px; border: 1px solid #bfdbfe;
    transition: background 0.12s;
  }
  .map-link:hover { background: #eff6ff; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .spinning { animation: spin 1s linear infinite; display: inline-block; }
</style>
</head>
<body>
<div class="card">
  <div class="pin-wrap" id="pinWrap">
    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/>
    </svg>
  </div>

  <h1>พิกัดของคุณ</h1>
  <p class="subtitle">กดปุ่มเพื่อตรวจสอบตำแหน่งปัจจุบัน</p>

  <button class="btn" id="locateBtn" onclick="getLocation()">
    <span id="btnIcon">&#9654;</span>
    <span id="btnText">ค้นหาพิกัดปัจจุบัน</span>
  </button>

  <p class="status" id="statusMsg"></p>

  <div class="results" id="results">
    <div class="grid">
      <div class="metric">
        <div class="metric-label">↑ ละติจูด</div>
        <div class="metric-value" id="lat">—</div>
      </div>
      <div class="metric">
        <div class="metric-label">→ ลองจิจูด</div>
        <div class="metric-value" id="lng">—</div>
      </div>
      <div class="metric full">
        <div class="metric-label">✓ ความแม่นยำ</div>
        <div class="metric-value" id="acc">—</div>
        <div class="bar-wrap"><div class="bar" id="accBar" style="width:0%"></div></div>
      </div>
    </div>

    <div class="actions">
      <button class="action-btn" onclick="copyCoords()">&#128203; คัดลอกพิกัด</button>
      <button class="action-btn" onclick="copyJSON()">&#123;&#125; คัดลอก JSON</button>
    </div>

    <a class="map-link" id="mapLink" href="#" target="_blank">
      &#127759; เปิดใน Google Maps
    </a>
  </div>
</div>

<script>
let coords = null;

function getLocation() {
  const btn = document.getElementById('locateBtn');
  const status = document.getElementById('statusMsg');
  const pin = document.getElementById('pinWrap');

  if (!navigator.geolocation) {
    status.textContent = 'Browser ไม่รองรับ Geolocation';
    status.className = 'status error';
    return;
  }

  btn.disabled = true;
  document.getElementById('btnIcon').innerHTML = '<span class="spinning">&#8635;</span>';
  document.getElementById('btnText').textContent = 'กำลังค้นหา...';
  status.textContent = 'กำลังระบุตำแหน่ง...';
  status.className = 'status';
  pin.classList.add('active');

  navigator.geolocation.getCurrentPosition(
    function(pos) {
      coords = {
        lat: pos.coords.latitude,
        lng: pos.coords.longitude,
        accuracy: Math.round(pos.coords.accuracy)
      };

      document.getElementById('lat').textContent = coords.lat.toFixed(6);
      document.getElementById('lng').textContent = coords.lng.toFixed(6);
      document.getElementById('acc').textContent = coords.accuracy + ' เมตร';

      const pct = Math.max(10, Math.min(100, 100 - (coords.accuracy / 200 * 100)));
      const bar = document.getElementById('accBar');
      bar.style.width = pct + '%';
      if (coords.accuracy > 100) bar.style.background = '#f59e0b';

      // ใช้ ll= เพื่อ center map ตรงพิกัด + q= เพื่อปักหมุด
      const mapUrl = `https://maps.google.com/maps?ll=${coords.lat},${coords.lng}&q=${coords.lat},${coords.lng}&z=17`;
      document.getElementById('mapLink').href = mapUrl;

      document.getElementById('results').style.display = 'block';
      status.textContent = '✓ พบตำแหน่งเรียบร้อย';
      status.className = 'status';
      pin.classList.remove('active');
      pin.style.background = '#d1fae5';
      pin.querySelector('svg').style.fill = '#059669';

      btn.disabled = false;
      document.getElementById('btnIcon').textContent = '↺';
      document.getElementById('btnText').textContent = 'อัปเดตพิกัด';
    },
    function(error) {
      const msgs = {
        1: 'ไม่ได้รับอนุญาต กรุณาอนุญาตการเข้าถึงตำแหน่งในเบราว์เซอร์',
        2: 'ไม่สามารถระบุตำแหน่งได้ในขณะนี้',
        3: 'หมดเวลาในการค้นหาตำแหน่ง'
      };
      status.textContent = msgs[error.code] || 'เกิดข้อผิดพลาด: ' + error.message;
      status.className = 'status error';
      pin.classList.remove('active');
      btn.disabled = false;
      document.getElementById('btnIcon').textContent = '↺';
      document.getElementById('btnText').textContent = 'ลองอีกครั้ง';
    },
    { enableHighAccuracy: true, timeout: 10000 }
  );
}

function copyCoords() {
  if (!coords) return;
  navigator.clipboard.writeText(coords.lat.toFixed(6) + ', ' + coords.lng.toFixed(6));
  alert('คัดลอกพิกัดแล้ว!');
}

function copyJSON() {
  if (!coords) return;
  navigator.clipboard.writeText(JSON.stringify({
    latitude: coords.lat,
    longitude: coords.lng,
    accuracy: coords.accuracy
  }, null, 2));
  alert('คัดลอก JSON แล้ว!');
}
</script>
</body>
</html>
